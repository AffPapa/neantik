name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-tests:
    name: Swift / ${{ matrix.suite }}
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite:
          - AppPathsTests
          - BrowserLaunchBuilderTests
          - BrowserProcessManagerTests
          - BrowserRuntimeInspectorTests
          - BrowserRuntimePreflightTests
          - FingerprintAuditLoopbackSTUNServerTests
          - FingerprintAuditTests
          - KeychainStoreTests
          - LaunchIntentTests
          - ProfileEditorPasswordTests
          - ProfileStoreTests
          - ProxyTesterTests
          - RuntimePreferenceStoreTests
          - TelemetryTests
          - UpdateManifestTests
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run Swift suite
        run: ./scripts/verify-native-swift-suite.sh "${{ matrix.suite }}"

  release-contracts:
    name: Release and privacy contracts
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Release build
        run: ./scripts/verify-native-swift-release.sh
      - name: Direct privacy contract
        run: python3 scripts/verify-direct-telemetry-disabled.py
      - name: Russian UI contract
        run: python3 scripts/verify-direct-ui-localization.py
      - name: Public fingerprint conformance corpus
        run: python3 scripts/verify-public-fingerprint-corpus.py
      - name: Apple device tuple catalog
        run: python3 scripts/verify-apple-device-tuples.py
      - name: Runtime patch manifest
        run: python3 scripts/verify-nevision-patchset-manifest.py --release
      - name: Open-source publication boundary
        run: python3 scripts/verify-open-source-tree.py
      - name: Python regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

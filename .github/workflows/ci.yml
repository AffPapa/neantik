name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swift-tests:
    name: Swift / Full test suite
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run complete non-live Swift test suite
        run: ./scripts/verify-native-swift-tests.sh

  release-contracts:
    name: Release and privacy contracts
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Release build
        run: ./scripts/verify-native-swift-release.sh
      - name: Direct privacy contract
        run: python3 scripts/verify-direct-telemetry-disabled.py
      - name: Secure Enclave release authority
        run: python3 scripts/verify-secure-enclave-release-authority.py
      - name: Russian UI contract
        run: python3 scripts/verify-direct-ui-localization.py
      - name: Public fingerprint conformance corpus
        run: python3 scripts/verify-public-fingerprint-corpus.py
      - name: Apple device tuple catalog
        run: python3 scripts/verify-apple-device-tuples.py
      - name: Browser identity issuance contract
        run: python3 scripts/verify-browser-identity-issuance.py
      - name: Runtime patch manifest
        run: python3 scripts/verify-nevision-patchset-manifest.py --release
      - name: Runtime integration notices
        run: python3 scripts/generate-runtime-integration-notices.py --check
      - name: Open-source publication boundary
        run: python3 scripts/verify-open-source-tree.py
      - name: Swift source size budgets
        run: python3 scripts/audit-source-budgets.py
      - name: Public workflow dependency closure
        run: python3 scripts/verify-public-workflow-references.py
      - name: Authenticated fingerprint evidence contract
        run: >-
          python3 -m unittest
          scripts.tests.test_fingerprint_evidence_schema8
          scripts.tests.test_direct_candidate_manifest
      - name: Python regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: AffPapa release regression tests
        run: python3 -m unittest discover -s ops/affpapa/tests -p 'test_*.py'

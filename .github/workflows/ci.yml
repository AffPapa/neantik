name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      toolchain_probe:
        description: "Only diagnose installed Xcode; no build or tests"
        type: boolean
        default: false
      diagnostic_suite:
        description: "One exact ordinary CI suite; empty runs full CI"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  toolchain-probe:
    if: ${{ inputs.toolchain_probe }}
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Diagnose compatible Xcode
        env:
          NEANTIK_DEVELOPER_DIR_DIAGNOSTICS: "1"
        run: ./scripts/resolve-compatible-developer-dir.sh

  swift-tests:
    if: ${{ ! inputs.toolchain_probe && inputs.diagnostic_suite == '' }}
    name: Swift / ${{ matrix.label }} shard
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        include:
          - shard: 0
            label: foundation
          - shard: 1
            label: fingerprint
          - shard: 2
            label: profiles-a
          - shard: 3
            label: profiles-b
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Run clean Swift shard
        run: python3 -B scripts/test-manager-ci.py --shard "${{ matrix.shard }}" --shards 4

  release-contracts:
    if: ${{ ! inputs.toolchain_probe && inputs.diagnostic_suite == '' }}
    name: Release and privacy contracts
    runs-on: macos-latest
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Release build
        run: ./scripts/verify-native-swift-release.sh
      - name: Direct privacy contract
        run: python3 scripts/verify-direct-telemetry-disabled.py
      - name: Russian UI contract
        run: python3 scripts/verify-direct-ui-localization.py
      - name: Public fingerprint conformance corpus
        run: python3 scripts/verify-public-fingerprint-corpus.py
      - name: Apple device tuple catalog
        run: python3 scripts/verify-apple-device-tuples.py
      - name: Browser identity issuance contract
        run: python3 scripts/verify-browser-identity-issuance.py
      - name: Runtime patch manifest
        run: python3 scripts/verify-nevision-patchset-manifest.py --release
      - name: Runtime integration notices
        run: python3 scripts/generate-runtime-integration-notices.py --check
      - name: Open-source publication boundary
        run: python3 scripts/verify-open-source-tree.py
      - name: Reachable Git history secret audit
        run: python3 scripts/audit-git-history-secrets.py
      - name: MCP public capability documentation
        run: python3 scripts/verify-mcp-documentation.py
      - name: Public workflow dependency closure
        run: python3 scripts/verify-public-workflow-references.py
      - name: Python regression tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: AffPapa release regression tests
        run: python3 -m unittest discover -s ops/affpapa/tests -p 'test_*.py' -v

  manager-diagnostic:
    if: ${{ ! inputs.toolchain_probe && inputs.diagnostic_suite != '' }}
    runs-on: macos-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      DIAGNOSTIC_SUITE: ${{ inputs.diagnostic_suite }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Diagnose one manager suite
        run: python3 -B scripts/test-manager-ci.py --suite "$DIAGNOSTIC_SUITE"

<!doctype html><meta charset="utf-8"><title>NeAntik WebKit persistence QA</title><style>body{font:18px system-ui;padding:24px}button{font:inherit;padding:12px;margin:8px}pre{white-space:pre-wrap}</style><h1>WebKit: собственный стенд NeAntik</h1><p>Только синтетические данные. Cookies, LocalStorage и IndexedDB.</p><button onclick="run('A')">Записать A</button><button onclick="run('B')">Записать B</button><button onclick="run(null)">Прочитать</button><a href="/two">Следующая страница</a><pre id="result">Проверка не запускалась</pre><script>
window.neantikOwnFixture=true;
async function run(value){try{const db=await new Promise((ok,fail)=>{const r=indexedDB.open('neantik-ui-qa',1);r.onupgradeneeded=()=>r.result.createObjectStore('values');r.onsuccess=()=>ok(r.result);r.onerror=()=>fail(r.error)});try{if(value!==null){localStorage.setItem('fixture',value);document.cookie='fixture='+value+'; Path=/; Max-Age=3600; SameSite=Lax';await new Promise((ok,fail)=>{const tx=db.transaction('values','readwrite');tx.objectStore('values').put(value,'fixture');tx.oncomplete=ok;tx.onerror=fail;tx.onabort=fail})}const stored=await new Promise((ok,fail)=>{const r=db.transaction('values').objectStore('values').get('fixture');r.onsuccess=()=>ok(r.result??null);r.onerror=fail});document.getElementById('result').textContent=JSON.stringify({localStorage:localStorage.getItem('fixture'),indexedDB:stored,cookie:document.cookie},null,2)}finally{db.close()}}catch(e){document.getElementById('result').textContent='Fixture failed: '+e.name}}
document.querySelector('h1').textContent=location.pathname==='/two' ? 'Вторая страница WebKit QA' : 'Первая страница WebKit QA'; document.title=location.pathname==='/two' ? 'WebKit QA page 2' : 'WebKit QA page 1';</script>
